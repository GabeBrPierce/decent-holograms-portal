# HoloPortal: a web editor for DecentHolograms.
#
# Open it at http://<server LAN IP>:<port>. Log in with the password below, or run
# /holoportal link in game for a one-time login link.
#
# Keep this on your LAN. Don't forward the port on your router: anyone with the password
# can run console commands through hologram click actions.

# Port for the web editor.
port: 8790

# Address to listen on. 0.0.0.0 = every network interface. 127.0.0.1 = this machine only.
bind: 0.0.0.0

# The address players' browsers use to reach the editor, used for /holoportal links.
# Leave empty to use this machine's LAN IP.
public-url: ""

# Login password. Generated on first start. Change it here, then /holoportal reload.
password: ""

# How long a login lasts, in hours.
session-hours: 12

heads:
  # Show the minecraft-heads.com library in the head picker. The server downloads each category
  # once and caches it in plugins/HoloPortal/heads for a week. Set to false to never contact the site.
  library: true
  # Optional: use minecraft-heads.com API v2 instead of the public lists. Register an app on
  # minecraft-heads.com to get an app UUID. Without a license (api-key) v2 only returns 100 demo heads.
  app-uuid: ""
  api-key: ""
